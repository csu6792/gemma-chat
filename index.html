<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Qwen 0.5B / 0.6B 問答 · WebLLM</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #151922;
      --border: #2a3140;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #7aa2ff;
      --ok: #6bcf8e;
      --warn: #e6b84d;
      --err: #f07178;
      --user: #1a3358;
      --ai: #1c2333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      flex-shrink: 0;
      padding: 12px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title { font-size: 0.95rem; font-weight: 600; }
    .sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .badge {
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: #222833;
      color: var(--muted);
      white-space: nowrap;
    }
    .badge.ok { color: var(--ok); }
    .badge.warn { color: var(--warn); }
    .badge.err { color: var(--err); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .msg { display: flex; gap: 8px; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }
    .bubble {
      max-width: min(520px, 85vw);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
    .msg.ai .bubble { background: var(--ai); border-bottom-left-radius: 4px; }

    .panel {
      margin: 8px auto;
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .panel h2 { font-size: 1rem; margin-bottom: 8px; font-weight: 600; }
    .panel p { font-size: 0.8rem; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
    select, button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    select {
      background: #1e2430;
      color: var(--text);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    #loadBtn {
      background: var(--accent);
      color: #0b0d12;
      font-weight: 600;
    }
    #loadBtn:disabled { opacity: 0.45; }
    #progress {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
      min-height: 1.2em;
    }
    .bar {
      height: 6px;
      background: #1e2430;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s;
    }

    .input-area {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--card);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .row { display: flex; gap: 8px; max-width: 720px; margin: 0 auto; }
    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1e2430;
      color: var(--text);
      padding: 11px 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    textarea:disabled { opacity: 0.5; }
    #send {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #0b0d12;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    #send:disabled { opacity: 0.4; }
    .hint {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">Qwen 問答（WebLLM）</div>
      <div class="sub">裝置端 · 適合手機試用的小模型</div>
    </div>
    <div class="badge" id="status">未載入</div>
  </header>

  <div id="chat">
    <div class="panel" id="setup">
      <h2>載入模型</h2>
      <p>
        建議先選 <b>Qwen2.5 0.5B</b>（約 0.9GB VRAM，較穩）。<br>
        若你的手機記憶體較充裕，可試 <b>Qwen3 0.6B</b>。
      </p>
      <select id="model">
  <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC" selected>
    Llama 3.2 1B Instruct（q4）
  </option>

  <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">
    Qwen2.5 0.5B
  </option>

  <option value="Qwen3-0.6B-q4f16_1-MLC">
    Qwen3 0.6B
  </option>

  <option value="SmolLM2-135M-Instruct-q0f16-MLC">
    SmolLM2 135M
  </option>
</select>
      <button type="button" id="loadBtn">載入模型</button>
      <div class="bar"><i id="bar"></i></div>
      <div id="progress">點上方按鈕開始。第一次需下載，請保持畫面開啟。</div>
    </div>
  </div>

  <div class="input-area">
    <div class="row">
      <textarea id="input" rows="1" placeholder="輸入問題…" disabled></textarea>
      <button type="button" id="send" disabled>➤</button>
    </div>
    <div class="hint">完全在瀏覽器執行 · 資料不送出伺服器</div>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const chat = document.getElementById("chat");
    const setup = document.getElementById("setup");
    const modelSel = document.getElementById("model");
    const loadBtn = document.getElementById("loadBtn");
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    let engine = null;
    let busy = false;
    const history = [
      {
        role: "system",
        content: "你是有幫助的助理。請用繁體中文簡潔回答。",
      },
    ];

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = "badge" + (cls ? " " + cls : "");
    }

    function addMsg(role, text) {
      const row = document.createElement("div");
      row.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    async function loadModel() {
      if (!navigator.gpu) {
        setStatus("無 WebGPU", "err");
        progress.textContent = "此瀏覽器沒有 WebGPU，無法使用 WebLLM。";
        return;
      }

      const modelId = modelSel.value;
      loadBtn.disabled = true;
      modelSel.disabled = true;
      setStatus("載入中…", "warn");
      progress.textContent = "開始下載 / 初始化…";
      bar.style.width = "0%";

      try {
        engine = await CreateMLCEngine(modelId, {
          initProgressCallback: (r) => {
            progress.textContent = r.text || "載入中…";
            if (typeof r.progress === "number") {
              bar.style.width = Math.round(r.progress * 100) + "%";
            }
          },
        });

        bar.style.width = "100%";
        progress.textContent = "模型就緒，可以開始提問。";
        setStatus("已就緒", "ok");
        input.disabled = false;
        sendBtn.disabled = false;
        loadBtn.textContent = "已載入";
        input.focus();
        addMsg("ai", "模型已載入。你可以直接用中文提問。");
      } catch (err) {
        console.error(err);
        setStatus("載入失敗", "err");
        progress.textContent =
          "失敗：" + (err.message || String(err)) +
          "\n可改選更小的模型，或關閉其他 App 後重試。";
        loadBtn.disabled = false;
        modelSel.disabled = false;
      }
    }

    async function ask() {
      const text = input.value.trim();
      if (!text || !engine || busy) return;

      busy = true;
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      addMsg("user", text);
      history.push({ role: "user", content: text });
      const bubble = addMsg("ai", "…");

      try {
        const stream = await engine.chat.completions.create({
          messages: history,
          stream: true,
          temperature: 0.7,
          max_tokens: 512,
        });

        let full = "";
        for await (const chunk of stream) {
          const delta = chunk.choices?.[0]?.delta?.content || "";
          full += delta;
          bubble.textContent = full || "…";
          chat.scrollTop = chat.scrollHeight;
        }
        if (!full) bubble.textContent = "（無回覆）";
        history.push({ role: "assistant", content: full });

        // 避免歷史過長佔記憶體
        if (history.length > 13) {
          history.splice(1, 2);
        }
      } catch (err) {
        console.error(err);
        bubble.textContent = "錯誤：" + (err.message || err);
      } finally {
        busy = false;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    loadBtn.addEventListener("click", loadModel);
    sendBtn.addEventListener("click", ask);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });

    if (!navigator.gpu) {
      setStatus("無 WebGPU", "err");
      progress.textContent = "偵測不到 WebGPU。";
      loadBtn.disabled = true;
    } else {
      setStatus("等待載入", "warn");
    }
  </script>
</body>
</html>
